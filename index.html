<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIFF ID 不整合検証テスト</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f9f9f9; }
        .box { padding: 15px; border-radius: 8px; margin-bottom: 20px; word-break: break-all; }
        .info { background: #e9ecef; border: 1px solid #ced4da; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { background: #06C755; color: white; border: none; padding: 12px 20px; border-radius: 5px; font-size: 16px; cursor: pointer; width: 100%; font-weight: bold; }
        button:active { background: #05a044; }
    </style>
</head>
<body>
    <h2>LIFF ID 初期化テスト</h2>
    
    <div class="box info">
        <p><strong>現在の環境:</strong> <span id="env">判定中...</span></p>
        <p style="font-size: 0.9em; color: #555;">※liff.init() 実行前でも環境判定は可能です。</p>
    </div>

    <p>初期化に使用する <strong>LIFF ID</strong> を入力してください：</p>
    <input type="text" id="liff-id-input" placeholder="例: 1234567890-abcdefgh">
    <button onclick="testInit()">liff.init() を実行</button>

    <div id="result-area" class="box" style="display: none; margin-top: 20px;"></div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        // ページ読み込み時に実行環境を表示
        document.addEventListener("DOMContentLoaded", () => {
            const envSpan = document.getElementById("env");
            const os = liff.getOS();
            const inClient = liff.isInClient() ? "LINEアプリ内 (LIFFブラウザ)" : "外部ブラウザ (Safari/Chrome等)";
            envSpan.textContent = `${os} / ${inClient}`;
        });

        // ボタンクリック時に指定されたIDで初期化を試みる
        async function testInit() {
            const liffId = document.getElementById("liff-id-input").value.trim();
            const resultArea = document.getElementById("result-area");
            
            if (!liffId) {
                alert("LIFF IDを入力してください");
                return;
            }

            // UIをリセットして実行中表示
            resultArea.style.display = "block";
            resultArea.className = "box info";
            resultArea.innerHTML = `<strong>${liffId}</strong> で初期化中...`;

            try {
                // ここで入力された任意のLIFF IDを使って初期化
                await liff.init({ liffId: liffId });
                
                // 成功ルート（外部ブラウザ等で発生しうる）
                resultArea.className = "box success";
                resultArea.innerHTML = `
                    <strong>✅ 初期化成功！</strong><br>
                    指定したLIFF IDで初期化されました。<br><br>
                    <small>※LINEアプリ内で「別のアプリのID」を指定した場合、ここには到達しません。</small>
                `;
            } catch (err) {
                // 失敗ルート（LINEアプリ内で別アプリのIDを指定した場合に発生する）
                resultArea.className = "box error";
                resultArea.innerHTML = `
                    <strong>❌ 初期化エラー</strong><br><br>
                    <strong>エラーコード:</strong> ${err.code || 'N/A'}<br>
                    <strong>メッセージ:</strong> ${err.message}<br>
                    <hr>
                    <small>※URL元のIDと入力したIDが不一致のため、LINEアプリのセキュリティ機構によりブロックされました。</small>
                `;
                console.error("Init Error:", err);
            }
        }
    </script>
</body>
</html>
