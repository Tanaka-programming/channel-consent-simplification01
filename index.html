<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>友だち追加デモ</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; }
        button {
            background-color: #06C755; color: white; border: none;
            padding: 15px 30px; font-size: 16px; border-radius: 8px;
            cursor: pointer; display: none; margin: 20px auto;
        }
        #status { color: #666; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h2>LIFF 友だち追加デモ</h2>
    <p id="status">LIFFを初期化中...</p>
    
    <button id="friendButton" onclick="requestFriend()">公式アカウントを友だち追加する</button>

    <script>
        // 🚨 ここにLINE Developersで取得したLIFF IDを入力してください
        const LIFF_ID = "2008456698-VKx1nnJd";

        // LIFFの初期化
        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                
                if (liff.isLoggedIn()) {
                    document.getElementById('status').innerText = "準備完了！ボタンを押してください。";
                    document.getElementById('friendButton').style.display = "block";
                } else {
                    document.getElementById('status').innerText = "ログインが必要です。";
                    liff.login(); // 外部ブラウザの場合はログイン画面へ遷移
                }
            } catch (err) {
                document.getElementById('status').innerText = "初期化エラー: " + err.message;
                console.error(err);
            }
        }

        // 友だち追加APIを呼び出す関数
        function requestFriend() {
            liff.requestFriendship()
                .then(() => {
                    document.getElementById('status').innerText = "友だち追加の操作が完了しました（または画面を閉じました）。";
                })
                .catch((err) => {
                    document.getElementById('status').innerText = "エラーが発生しました: " + err.message;
                    console.error(err);
                });
        }

        // ページ読み込み時に初期化を実行
        window.onload = initializeLiff;
    </script>
</body>
</html>
